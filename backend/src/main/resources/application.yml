spring:
  application:
    name: revenue-intelligence-engine

  # The POC ships a single "data" profile that loads the generated dataset.
  profiles:
    default: data

  datasource:
    url: jdbc:h2:mem:revintel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # CRITICAL: without this, Spring runs data.sql BEFORE Hibernate creates the
    # schema and every INSERT fails with "table not found". See README / spec 5.2.
    defer-datasource-initialization: true
    properties:
      hibernate.jdbc.time_zone: UTC

  sql:
    init:
      mode: always
      platform: h2
      # Generated by data-tools/build_dataset.py. "optional:" so the app still
      # boots before the generator has ever been run; DataBootstrap then loads
      # db/data-fallback.sql instead.
      data-locations: optional:classpath:db/generated/data.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.cognizant.revintel: INFO

revintel:
  narrative:
    # Left unset by default -> NarrativeService skips the LLM entirely and
    # renders templates. Export ANTHROPIC_API_KEY to enable the LLM path.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5
    max-tokens: 1024
    # Narration is two or three sentences over numbers that are already computed -- it needs no
    # deep reasoning, so run it at low effort.
    effort: low
    timeout-seconds: 20
  evals:
    # Both left blank on purpose: EvalsService probes the standard locations relative to either
    # the repo root or backend/, whichever the app was launched from. Set these only if you keep
    # the artefacts somewhere unusual.
    #   data-report:   data-tools/output/data_eval_results.json  (written by build_dataset.py)
    #   surefire-dir:  backend/target/surefire-reports           (written by `mvn test`)
    data-report: ""
    surefire-dir: ""
